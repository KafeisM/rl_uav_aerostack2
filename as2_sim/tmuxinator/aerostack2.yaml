<%
# Input parameters
drone_namespace           = @settings["drone_namespace"]
simulation_config_file    = @settings["simulation_config_file"]
motion_controller_plugin  = @settings["motion_controller_plugin"]
base_launch               = @settings["base_launch"] == "true"
overlay_setup_file        = @settings["overlay_setup_file"]
overlay_prefix_expected   = @settings["overlay_prefix_expected"]
%>
name: <%= drone_namespace %>
attach: false
root: ./
startup_window: platform
pre_window: 'source /opt/ros/humble/setup.bash && source <%= overlay_setup_file %> && simulator_prefix=$(ros2 pkg prefix as2_platform_multirotor_simulator) && case "${simulator_prefix}" in <%= overlay_prefix_expected %>*) ;; *) echo "Error - stale as2_platform_multirotor_simulator prefix ${simulator_prefix}" >&2; exit 1 ;; esac'
windows:
  # Platform
  - platform:
      layout: tiled
      panes:
        # base_launch:=false attaches only the namespaced platform node to the
        # already-running physics simulator spawned by the first (base) drone.
        - ros2 launch as2_platform_multirotor_simulator as2_platform_multirotor_simulator.launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
            uav_config:=config/uav_config.yaml
            world_config:=<%= simulation_config_file %>
            base_launch:=<%= base_launch %>

  # Basic Robotics Functions
  - basics_robotics_functions:
      layout:
      panes:
        # State Estimation
        - ros2 launch as2_state_estimator state_estimator_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
        # Motion Controller
        - ros2 launch as2_motion_controller controller_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
            plugin_name:=<%= motion_controller_plugin %>
            plugin_config_file:=config/<%= motion_controller_plugin %>.yaml

  # Behaviors
  - behaviors:
      layout:
      panes:
        # Motion Behaviors
        - ros2 launch as2_behaviors_motion motion_behaviors_launch.py
            namespace:=<%= drone_namespace %>
            config_file:=config/config.yaml
<% if base_launch %>

  # Visualization (RViz) — only on the base drone to avoid duplicate RViz windows
  # fighting over the shared simulator's TF tree.
  - visualization:
      layout:
      panes:
        - ros2 launch as2_visualization as2_visualization.launch.py
            namespace:=<%= drone_namespace %>
            use_sim_time:=false
            rviz:=true
<% end %>

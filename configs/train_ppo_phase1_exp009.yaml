experiment:
  name: ppo_phase1_exp009_certified_reset_1m_5k
  seed: 42
  output_root: runs/ppo

environment:
  env_id: AS2TestEnv-v0
  num_envs: 1
  vec_env: dummy
  namespace_prefix: drone
  use_sim_time: false
  verbose: false

  # Exp009: first run on the certified reset stack (FSM sync, pose freshness,
  # fixed vertical geometry, 1.0 m target). Inherits the Exp008a curriculum;
  # bounded 5k gate before any long training.
  pos_limit: 5.0
  max_vel: 0.5
  reset_max_vel: 1.0
  reset_xy_kp: 1.0
  reset_z_kp: 1.0
  max_yaw_vel: 1.5707963267948966
  # Live AS2 needs a command window long enough for the controller and physics
  # to react; the reset actionability probe confirms motion over about 0.6 s.
  step_duration: 0.2
  command_publication_interval: 0.05
  min_motion_command_publications: 4
  # DroneInterface executor spin rate (Hz). Must exceed the combined inbound
  # telemetry rate (~130 msg/s) so observed pose stays fresh within one step.
  interface_spin_rate: 300.0
  fixed_start_pose: [0.0, 0.0, 1.6, 0.0]
  fixed_start_tolerance: 0.22
  fixed_start_timeout: 60.0
  # Early curriculum: position reset is the hard gate; yaw is diagnostic only.
  reset_yaw_tolerance: 1.2
  reset_yaw_required: false
  reset_min_speed: 0.20
  reset_ground_recovery_height: 1.4
  # Vertical safety geometry (nominal z = 1.6):
  #   floor 0.8 < unsafe 1.0 < guard 1.0+max(0.30, 2*max_vel*step_duration=0.20)=1.3
  #   < worst-case reset start 1.6-0.242 < start/target 1.6 < ceiling 2.5.
  # The guard and the descent-penalty band top (unsafe + band = 1.3) stay
  # >= 2*max_vel*step_duration below the start/target altitude so nominal
  # flight is never overridden or penalized, while the guard still fires
  # 0.3 m (0.6 s at max descent) before the unsafe terminal threshold.
  unsafe_low_altitude_threshold: 1.0
  low_altitude_guard_margin: 0.30
  low_altitude_guard_climb_speed: 0.5
  vertical_safety_band: 0.30
  vertical_safety_penalty_weight: 6.0
  vertical_descent_penalty_weight: 8.0
  # Start-target separation must exceed distance_threshold by more than the
  # reset restore tolerance (~0.22 m) plus the observed post-reset z settle
  # (~0.10 m); 0.5 m separation with a 0.4 m threshold produced instant-success
  # zero-motion episodes after in-air resets.
  target_pose: [1.0, 0.0, 1.6, 0.0]
  distance_threshold: 0.4
  max_steps: 80
  success_reward: 20.0
  oob_penalty: 15.0
  # Keep path-facing present as a low-weight regularizer, not an early hard objective.
  path_facing_weight: 0.05
  progress_reward_weight: 2.0
  speed_deadband: 0.05

  close_operation_timeout: 10.0
  # Last-resort stabilization for live gates: velocity reset remains primary.
  use_service_reset_after_velocity_timeout: true

  publish_target_marker: true
  target_marker_topic: visualization_marker
  target_marker_frame_id: earth
  target_marker_scale: 0.35

  monitor_info_keywords: [is_success, final_distance, is_out_of_bounds, is_unsafe_low_altitude, altitude, terminal_reason, terminal_stop_command_accepted, physical_displacement, path_length, max_physical_displacement, min_altitude, motion_command_steps, motion_command_accepted_steps, motion_command_acceptance_rate, mean_action_norm, max_action_norm, mean_xy_action_norm, max_xy_action_norm, last_action_vx, last_action_vy, last_action_vz, last_action_vyaw, reset_method, reset_path, reset_service_attempted, reset_failure_class, reset_position_error, reset_yaw_error, reset_service_status, vertical_safety_penalty, low_altitude_guard_active]

  randomize_hover_start: false
  scene_bounds_xy: 5.0
  height_bounds: [0.8, 2.5]
  min_start_target_distance: 0.5
  hover_speed_threshold: 0.05
  hover_settle_time: 1.0
  hover_timeout: 20.0
  max_reset_sample_attempts: 100

training:
  total_timesteps: 5000
  device: cpu
  tensorboard_log_subdir: tensorboard
  monitor_subdir: monitor
  checkpoints_subdir: checkpoints
  checkpoint_freq: 1000
  checkpoint_prefix: ppo_phase1_exp009

ppo:
  policy: MlpPolicy
  learning_rate: 1.0e-04
  n_steps: 128
  batch_size: 64
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.005
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  use_sde: true
  sde_sample_freq: 8
  policy_kwargs:
    activation_fn: ReLU
    net_arch:
      pi: [128, 128]
      vf: [128, 128]

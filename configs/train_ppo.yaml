experiment:
  name: ppo_as2_baseline
  seed: 42
  output_root: runs/ppo

environment:
  env_id: AS2TestEnv-v0
  num_envs: 1
  vec_env: dummy  # dummy | subproc
  namespace_prefix: drone
  use_sim_time: false
  verbose: false

  # Keep environment contract and normalization assumptions unchanged.
  pos_limit: 5.0
  max_vel: 2.0
  reset_max_vel: null
  reset_xy_kp: 1.0
  reset_z_kp: 1.0
  max_yaw_vel: 3.141592653589793
  step_duration: 0.1
  command_publication_interval: 0.05
  min_motion_command_publications: 1
  # DroneInterface executor spin rate (Hz). Must exceed the combined inbound
  # telemetry rate (~130 msg/s) so observed pose stays fresh within one step.
  interface_spin_rate: 300.0
  target_pose: [0.0, 0.0, 1.0, 0.0]
  distance_threshold: 0.5
  max_steps: 500
  success_reward: 20.0
  oob_penalty: 10.0
  path_facing_weight: 0.25
  progress_reward_weight: 0.0
  speed_deadband: 0.05
  fixed_start_pose: null
  fixed_start_tolerance: 0.15
  fixed_start_timeout: 20.0
  reset_yaw_tolerance: 0.38
  reset_yaw_required: true
  reset_min_speed: 0.15
  reset_ground_recovery_height: 0.35
  # Training safety threshold: terminates before the physical lower scene bound.
  unsafe_low_altitude_threshold: 0.30
  low_altitude_guard_margin: 0.20
  low_altitude_guard_climb_speed: 0.15
  vertical_safety_band: 0.0
  vertical_safety_penalty_weight: 0.0
  vertical_descent_penalty_weight: 0.0
  publish_target_marker: false
  target_marker_topic: visualization_marker
  target_marker_frame_id: earth
  target_marker_scale: 0.35
  close_operation_timeout: 10.0
  use_service_reset_after_velocity_timeout: false
  monitor_info_keywords: [is_success, final_distance, is_out_of_bounds, is_unsafe_low_altitude, altitude, terminal_reason, terminal_stop_command_accepted, physical_displacement, path_length, max_physical_displacement, min_altitude, motion_command_steps, motion_command_accepted_steps, motion_command_acceptance_rate, mean_action_norm, max_action_norm, mean_xy_action_norm, max_xy_action_norm, last_action_vx, last_action_vy, last_action_vz, last_action_vyaw, reset_method, reset_path, reset_service_attempted, reset_failure_class, reset_position_error, reset_yaw_error, reset_service_status, vertical_safety_penalty, low_altitude_guard_active]

  # Randomized hover training (disabled by default for backward compatibility)
  randomize_hover_start: false
  scene_bounds_xy: 5.0
  height_bounds: [0.1, 2.0]
  min_start_target_distance: 1.0
  hover_speed_threshold: 0.05
  hover_settle_time: 1.0
  hover_timeout: 10.0
  max_reset_sample_attempts: 100

training:
  total_timesteps: 1000000
  # SB3 recommends CPU for non-CNN/MLP PPO policies; avoids GPU warning and overhead.
  device: cpu
  tensorboard_log_subdir: tensorboard
  monitor_subdir: monitor
  checkpoints_subdir: checkpoints
  checkpoint_freq: 10000
  checkpoint_prefix: ppo_as2

ppo:
  policy: MlpPolicy
  learning_rate: 3.0e-05
  n_steps: 512
  batch_size: 32
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  normalize_advantage: true
  use_sde: true
  sde_sample_freq: 8
  policy_kwargs:
    activation_fn: ReLU
    net_arch:
      pi: [128, 128]
      vf: [128, 128]
